<meta charset="utf-8">
<title>Linger Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet porcelain page, photo-led sections on a 1240px column; one orchestrated hero reveal, slow eased motion everywhere else. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E7EBE4; --ink:#15221D; --muted:#5B6862; --line:#D5DBD2;
  --accent:#A3742A; --accent-ink:#FFFFFF; --pine:#1F3A30; --on-photo:#FFFFFF; --scrim:rgba(10,18,14,.55);
  --dot:#C9D0C6; --ok:#2F7A55; --band:#1F3A30; --band-ink:#F1F4EE;
  --shadow:0 1px 2px rgba(21,34,29,.06),0 18px 50px -18px rgba(21,34,29,.28);
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1); --r:18px; --max:1240px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1310; --surface:#131C18; --sunk:#1A2520; --ink:#E8EDE6; --muted:#97A49D; --line:#25322C;
  --accent:#D4A55A; --accent-ink:#1A1309; --pine:#A8C9B9; --dot:#2A3832; --ok:#6CC596; --band:#18302A; --band-ink:#E8EDE6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1310; --surface:#131C18; --sunk:#1A2520; --ink:#E8EDE6; --muted:#97A49D; --line:#25322C;
  --accent:#D4A55A; --accent-ink:#1A1309; --pine:#A8C9B9; --dot:#2A3832; --ok:#6CC596; --band:#18302A; --band-ink:#E8EDE6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 50px -18px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:clamp(30px,4.2vw,48px)}
h2 em,h1 em{font-style:italic;font-weight:400}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .4s,box-shadow .4s}
header.top.scrolled{border-color:var(--line)}
.nav{display:flex;align-items:center;gap:28px;height:68px}
.logo{font:italic 500 30px/1 var(--display);text-decoration:none;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.logo i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;transform:translateY(-2px)}
.nav .links{display:flex;gap:4px;margin-left:12px}
.nav .links a{position:relative;text-decoration:none;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;color:var(--muted);transition:color .3s}
.nav .links a.on,.nav .links a:hover{color:var(--ink)}
.nav .links a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1.5px;background:var(--accent);transform-origin:left;animation:lineIn .6s var(--ease)}
@keyframes lineIn{from{transform:scaleX(0)}}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font-weight:700;font-size:14px;text-decoration:none;transition:transform .5s var(--ease),background .3s,box-shadow .5s var(--ease)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-gold{background:var(--accent);color:var(--accent-ink);position:relative;overflow:hidden}
.btn-gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}
.btn-gold:hover::after{transform:translateX(120%);transition:transform .9s var(--ease)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-ghost{border:1px solid var(--line);background:var(--surface)}
.btn-ghost:hover{border-color:var(--ink)}
.curwrap{position:relative}
.cur{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;transition:border-color .3s}
.cur:hover,.cur[aria-expanded="true"]{border-color:var(--ink)}
.cur .sym{font:500 15px var(--display);color:var(--accent)}
.cur svg{transition:transform .45s var(--ease)}
.cur[aria-expanded="true"] svg{transform:rotate(180deg)}
.curmenu{position:absolute;right:0;top:calc(100% + 10px);z-index:80;width:290px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:8px;animation:popIn .45s var(--ease);transform-origin:top right}
.curmenu .ch{padding:10px 12px 8px;font-size:12px;color:var(--muted)}
.curmenu button{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:12px;text-align:left;transition:background .25s;animation:fade .5s var(--ease) both}
.curmenu button:hover,.curmenu button:focus-visible{background:var(--sunk)}
.curmenu .s{font:500 18px var(--display);color:var(--accent);text-align:center}
.curmenu .s.sm{font:700 11px var(--body);letter-spacing:.02em}
.curmenu b{display:block;font-size:14px}
.curmenu small{color:var(--muted);font-size:12px}
.curmenu .tick{opacity:0;color:var(--ok)}
.curmenu button[aria-selected="true"] .tick{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:99;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;animation:toastIn .6s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}}
.swapin{animation:fade .8s var(--ease) both}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--pine);color:var(--bg);display:grid;place-items:center;font:600 14px var(--body)}

/* Views & transitions */
main{min-height:60vh}
[data-view]{animation:viewIn .8s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}
::view-transition-old(root){animation:.35s var(--ease) both vtOut}
::view-transition-new(root){animation:.7s var(--ease) both vtIn}
@keyframes vtOut{to{opacity:0;transform:translateY(-8px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(12px)}}

/* Hero */
.hero{position:relative;margin-top:8px;border-radius:28px;overflow:hidden;height:clamp(460px,52vw,640px);color:var(--on-photo);animation:unveil 1.6s var(--ease) both}
@keyframes unveil{from{clip-path:inset(10% 6% 10% 6% round 40px)}to{clip-path:inset(0 0 0 0 round 28px)}}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:drift 2.8s var(--ease) both}
@keyframes drift{from{transform:scale(1.18)}to{transform:scale(1.02)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,14,.05) 30%,var(--scrim) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:120px;z-index:2;padding:0 clamp(20px,5vw,64px)}
.hero h1{font-size:clamp(44px,8.4vw,112px);font-weight:400;line-height:.95;letter-spacing:-.025em;color:var(--on-photo)}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.hero h1 .w>span{display:inline-block;animation:rise 1.2s var(--ease) both}
@keyframes rise{from{transform:translateY(105%)}}
.hero p{max-width:440px;margin:18px 0 0;font-size:16px;opacity:.92;animation:fade 1s .9s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.hero .meta{position:absolute;top:22px;right:24px;z-index:2;font:500 11px/1.4 var(--mono);letter-spacing:.06em;text-align:right;opacity:.85;animation:fade 1s 1.2s both}

/* Search */
.search{position:relative;z-index:5;margin:-62px auto 0;max-width:1000px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);padding:10px;animation:fade 1s 1s var(--ease) both}
.tabs{position:relative;display:inline-flex;gap:2px;padding:4px;margin:2px 0 8px 6px;background:var(--sunk);border-radius:999px}
.tabs button{position:relative;z-index:1;padding:7px 18px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);transition:color .4s}
.tabs button.on{color:var(--ink)}
.tabs .pill{position:absolute;top:4px;bottom:4px;border-radius:999px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:left .55s var(--ease),width .55s var(--ease)}
.fields{display:grid;grid-template-columns:1.4fr 1.2fr 1fr auto;gap:4px;align-items:stretch}
.field{position:relative;text-align:left;padding:12px 18px;border-radius:16px;transition:background .3s;min-width:0}
.field:hover{background:var(--sunk)}
.field label,.field .lab{display:block;font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field .val{width:100%;border:0;background:none;padding:0;font-weight:600;font-size:15px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.field+.field::before{content:"";position:absolute;left:-2px;top:22%;bottom:22%;width:1px;background:var(--line)}
.go{height:auto;min-height:58px;padding:0 26px;border-radius:16px}
.go svg{transition:transform .5s var(--ease)}
.go:hover svg{transform:rotate(-12deg) scale(1.1)}

/* Calendar popover */
.pop{position:absolute;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px;animation:popIn .5s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.cal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.cal h4{margin:0 0 10px;text-align:center;font:500 18px var(--display)}
.calnav{display:flex;justify-content:space-between;margin-bottom:-30px;position:relative;z-index:1}
.calnav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .3s}
.calnav button:hover{background:var(--sunk)}
.grid7{display:grid;grid-template-columns:repeat(7,40px);gap:2px 0}
.grid7 .dw{font:600 11px var(--body);color:var(--muted);text-align:center;padding:6px 0}
.day{height:40px;font-weight:600;font-size:13px;position:relative;font-variant-numeric:tabular-nums}
.day span{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:background .25s,color .25s}
.day:hover span{border:1px solid var(--ink)}
.day:disabled{color:var(--line);cursor:default}
.day:disabled:hover span{border:0}
.day.in{background:var(--sunk)}
.day.s,.day.e{background:linear-gradient(90deg,transparent 50%,var(--sunk) 50%)}
.day.e{background:linear-gradient(90deg,var(--sunk) 50%,transparent 50%)}
.day.s.e,.day.solo{background:none}
.day.s span,.day.e span{background:var(--ink);color:var(--bg)}
.calfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}

/* Sections */
section.block{padding-block:clamp(56px,8vw,104px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.head p{max-width:380px;margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px}
.card{position:relative;text-decoration:none;display:block;cursor:pointer}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--sunk);max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.card:hover .ph img{transform:scale(1.07)}
.card .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.25));opacity:0;transition:opacity .6s}
.card:hover .ph::after{opacity:1}
.card .badge{position:absolute;left:12px;top:12px;z-index:2;background:var(--surface);color:var(--ink);font:700 11px/1 var(--body);letter-spacing:.04em;padding:7px 10px;border-radius:999px}
.card .info{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 2px 0}
.card .name{font:500 19px/1.2 var(--display)}
.card .place{grid-column:1;font-size:13px;color:var(--muted)}
.card .rate{font-size:13px;font-weight:600;display:flex;gap:4px;align-items:center}
.card .price{grid-column:1/-1;margin-top:6px;font-size:14px}
.card .price b{font-weight:700}
.card.hl .ph{box-shadow:0 0 0 2px var(--accent)}
.heart{position:absolute;right:12px;top:12px;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .4s var(--ease)}
.heart:hover{transform:scale(1.1)}
.heart svg{width:18px;height:18px;fill:rgba(0,0,0,.25);stroke:#fff;stroke-width:2;transition:fill .3s}
.heart.on svg{fill:#E2475B;stroke:#E2475B;animation:pop .6s var(--ease)}
.heart.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #E2475B;animation:ring .6s var(--ease) forwards}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.8);opacity:0}}

/* Scroll-linked reveal: visible at rest; animates only where supported */
@supports (animation-timeline:view()){@media (prefers-reduced-motion:no-preference){
  .reveal{animation:revealIn linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
  .para img{animation:par linear both;animation-timeline:view();animation-range:cover}
}}
@keyframes revealIn{from{opacity:.001;transform:translateY(40px)}}
@keyframes par{from{transform:translateY(-6%) scale(1.12)}to{transform:translateY(6%) scale(1.12)}}

/* Destinations */
.dests{display:grid;grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:260px 260px;gap:18px}
.dest{position:relative;border-radius:var(--r);overflow:hidden;color:var(--on-photo);text-decoration:none;display:block}
.dest:first-child{grid-row:span 2}
.dest img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
.dest:hover img{transform:scale(1.06)}
.dest::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,14,11,.65))}
.dest .t{position:absolute;left:22px;right:22px;bottom:20px;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:10px}
.dest h3{font-size:clamp(24px,2.6vw,34px);color:var(--on-photo)}
.dest small{font:500 12px var(--mono);opacity:.85}
.dest .arrow{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:grid;place-items:center;flex:none;transition:background .4s,transform .6s var(--ease)}
.dest:hover .arrow{background:#fff;color:#111;transform:rotate(-45deg)}

/* Host band */
.host{background:var(--band);color:var(--band-ink);border-radius:28px;padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,5vw,64px);align-items:center;overflow:hidden;position:relative}
.host h2{color:var(--band-ink)}
.host p{opacity:.8;max-width:420px}
.host .eyebrow{color:var(--band-ink);opacity:.7}
.est{background:color-mix(in srgb,var(--band-ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--band-ink) 18%,transparent);border-radius:22px;padding:26px}
.est .big{font:400 clamp(48px,6vw,76px)/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.est .row{display:flex;justify-content:space-between;font-size:13px;opacity:.8;margin-top:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.seg button{padding:7px 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--band-ink) 25%,transparent);font-size:13px;font-weight:600;transition:background .3s,color .3s}
.seg button.on{background:var(--band-ink);color:var(--band)}
input[type=range]{width:100%;margin-top:10px;accent-color:var(--accent)}

/* Flights teaser + footer */
.fly{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.fly .ph{border-radius:var(--r);overflow:hidden;position:relative;min-height:320px}
.fly .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fly .txt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,4vw,48px);display:flex;flex-direction:column;justify-content:center;gap:16px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-block:44px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* Results */
.rhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:28px 18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;transition:all .35s var(--ease)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.map{position:relative;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden;aspect-ratio:72/27;max-width:100%;margin-bottom:34px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map circle{fill:var(--dot)}
.pin{position:absolute;transform:translate(-50%,-50%);z-index:2;background:var(--surface);color:var(--ink);font:700 12px/1 var(--body);padding:7px 10px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18);border:1px solid var(--line);white-space:nowrap;transition:transform .45s var(--ease),background .3s,color .3s;animation:pinIn .7s var(--ease) both}
@keyframes pinIn{from{opacity:0;transform:translate(-50%,-20%) scale(.6)}}
.pin:hover,.pin.hl{transform:translate(-50%,-50%) scale(1.15);background:var(--ink);color:var(--bg);z-index:3}
.pin::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--accent);z-index:-1;opacity:0}
.pin.hl::after{animation:ping 1.4s var(--ease) infinite}
@keyframes ping{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(7)}}
.skel .ph{background:linear-gradient(100deg,var(--sunk) 40%,color-mix(in srgb,var(--sunk) 60%,var(--surface)) 50%,var(--sunk) 60%) 0 0/300% 100%;animation:shim 1.2s linear infinite}
.skel .bar{height:12px;border-radius:6px;margin-top:12px;background:var(--sunk)}
@keyframes shim{to{background-position:-150% 0}}
.stagger>*{animation:fade .9s var(--ease) both}

/* Property */
.crumbs{padding-top:26px;font-size:13px;color:var(--muted)}
.crumbs a{text-decoration:none}
.ptitle{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:12px 0 22px}
.ptitle h1{font-size:clamp(36px,5.4vw,64px);font-weight:400}
.ptitle .sub{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:230px 230px;gap:10px;border-radius:24px;overflow:hidden}
.gallery button{position:relative;overflow:hidden;background:var(--sunk)}
.gallery button:first-child{grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease),filter .6s}
.gallery button:hover img{transform:scale(1.05)}

let calBase = new Date(2026, 11, 1), calEl = null, calCb = null;
function closeCal() { calEl?.remove(); calEl = null; }
function openCal(anchor, cb) {
  closeCal(); calCb = cb;
  calEl = document.createElement('div'); calEl.className = 'pop'; calEl.setAttribute('role', 'dialog'); calEl.setAttribute('aria-label', 'Choose dates');
  document.body.appendChild(calEl); drawCal();
  const r = anchor.getBoundingClientRect(), w = Math.min(640, innerWidth - 32);
  calEl.style.width = w + 'px';
  calEl.style.top = (r.bottom + scrollY + 10) + 'px';
  calEl.style.left = Math.max(16, Math.min(r.left + scrollX, innerWidth - w - 16)) + 'px';
}
function month(y, m) {
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let h = `<div><h4>${first.toLocaleDateString('en-US', { month:'long', year:'numeric' })}</h4><div class="grid7">` + ['M','T','W','T','F','S','S'].map(d => `<span class="dw">${d}</span>`).join('');
  for (let i = 0; i < off; i++) h += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), t = +dt, f = +S.from, e = S.to ? +S.to : null;
    const c = [t === f ? 's' : '', e && t === e ? 'e' : '', e && t > f && t < e ? 'in' : '', !e ? 'solo' : ''].join(' ');
    h += `<button class="day ${c}" data-d="${t}" ${dt < TODAY ? 'disabled' : ''}><span>${d}</span></button>`;
  }
  return h + '</div></div>';
}
function drawCal() {
  const y = calBase.getFullYear(), m = calBase.getMonth();
  calEl.innerHTML = `<div class="calnav"><button data-cm="-1" aria-label="Previous month">${icon.l}</button><button data-cm="1" aria-label="Next month">${icon.r}</button></div>
   <div class="cal">${month(y, m)}${month(y, m + 1)}</div>
   <div class="calfoot"><span><b>${nights()} night${nights() > 1 ? 's' : ''}</b> · <span class="muted">${datesLabel()}</span></span><button class="btn btn-ink" style="height:38px" data-calok>Done</button></div>`;
}
document.addEventListener('click', e => {
  const t = e.target;
  if (calEl && calEl.contains(t)) {
    const cm = t.closest('[data-cm]'), d = t.closest('[data-d]');
    if (cm) { calBase = new Date(calBase.getFullYear(), calBase.getMonth() + +cm.dataset.cm, 1); if (calBase < new Date(2026, 10, 1)) calBase = new Date(2026, 10, 1); drawCal(); }
    else if (d) {
      const dt = new Date(+d.dataset.d);
      if (S.to || dt <= S.from) { S.from = dt; S.to = null; } else S.to = dt;
      drawCal(); calCb && calCb();
    } else if (t.closest('[data-calok]')) { if (!S.to) S.to = new Date(+S.from + 864e5); calCb && calCb(); closeCal(); }
    return;
  }
  if (calEl && !t.closest('[data-dates]')) closeCal();
});

const acCache = new Map(); let acT = 0, acSeq = 0;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const hiTxt = (s, q) => { s = esc(s); const i = s.toLowerCase().indexOf(q.toLowerCase()); return i < 0 || !q ? s : s.slice(0, i) + '<mark>' + s.slice(i, i + q.length) + '</mark>' + s.slice(i + q.length); };
async function places(q) {
  const k = q.toLowerCase(); if (acCache.has(k)) return acCache.get(k);
  let res;
  const local = AIRPORTS.filter(p => [p.name, p.city, p.code].some(v => v && v.toLowerCase().includes(k)))
    .sort((a, b) => (b.code.toLowerCase() === k) - (a.code.toLowerCase() === k) || (b.type === 'city') - (a.type === 'city'));
  res = local;
  if (API) {
    const r = await fetch('/api/places?q=' + encodeURIComponent(q)); const api = r.ok ? await r.json() : [];
    const seen = new Set(api.map(p => p.type + p.code));
    res = [...api, ...local.filter(p => !seen.has(p.type + p.code))];
  }
  const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const rank = p => p.code.toLowerCase() === k ? 0 : [p.city, p.name].some(v => norm(v).startsWith(norm(k))) ? 1 : [p.city, p.name].some(v => norm(v).split(/[\s,–-]+/).some(w => w.startsWith(norm(k)))) ? 2 : 3;
  res = res.filter(p => p.code).map((p, i) => ({ p, i, r: rank(p) })).sort((a, b) => a.r - b.r || a.i - b.i).map(x => x.p).slice(0, 10);
  acCache.set(k, res); return res;
}
function acClose(inp) { (inp?.parentElement || document).querySelectorAll('.acl').forEach(l => l.remove()); if (inp) inp.setAttribute('aria-expanded', 'false'); else $$('[data-ac]').forEach(i => i.setAttribute('aria-expanded', 'false')); }
function acRender(inp, q, list) {
  acClose(inp);
  const l = document.createElement('div'); l.className = 'acl'; l.id = inp.id + '-list'; l.setAttribute('role', 'listbox');
  const cityCodes = new Set(list.filter(p => p.type === 'city').map(p => p.city || p.name));
  l.innerHTML = list.length ? list.map((p, i) => {
    const city = p.type === 'city', sub = !city && cityCodes.has(p.city);
    const ic = city ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l6-4v16M10 21V3l10 5v13M3 21h18M14 11h2M14 15h2"/></svg>' : icon.plane.replace('<svg ', '<svg style="color:var(--muted)" ');
    return `<div class="aco ${sub ? 'sub' : ''}" role="option" id="${inp.id}-o${i}" data-i="${i}" aria-selected="false">${ic}<span><b>${hiTxt(city ? p.name + ' · all airports' : p.name, q)}</b><small>${hiTxt([p.city, p.country].filter(Boolean).join(', '), q)}</small></span><span class="cd">${hiTxt(p.code, q)}</span></div>`;
  }).join('') : `<div class="acempty">No airports match "${esc(q)}". Try a city name or a 3-letter code.</div>`;
  l._list = list; inp.parentElement.appendChild(l); inp.setAttribute('aria-expanded', 'true'); inp.setAttribute('aria-controls', l.id);
}
function acPick(inp, p) {
  inp.value = `${p.type === 'city' ? p.name : (p.city || p.name)} (${p.code})`;
  acClose(inp); inp.removeAttribute('aria-activedescendant');
  if (/from$/.test(inp.id)) S.flFrom = inp.value; else S.flTo = inp.value;
  if ($('#fTitle')) $('#fTitle').innerHTML = fTitle();
  inp.animate([{ color: 'var(--accent)' }, { color: 'inherit' }], { duration: 900 });
  if (inp.id.startsWith('f-') && iata($('#f-from').value) && iata($('#f-to').value)) API ? loadLive() : fillOffers();
}
function acMove(inp, d) {
  const l = inp.parentElement.querySelector('.acl'); if (!l) return;
  const o = $$('.aco', l); if (!o.length) return;
  let i = o.findIndex(x => x.getAttribute('aria-selected') === 'true'); o[i]?.setAttribute('aria-selected', 'false');
  i = (i + d + o.length) % o.length; o[i].setAttribute('aria-selected', 'true'); o[i].scrollIntoView({ block: 'nearest' });
  inp.setAttribute('aria-activedescendant', o[i].id);
}
document.addEventListener('input', e => {
  const inp = e.target.closest('[data-ac]'); if (!inp) return;
  if (/from$/.test(inp.id)) S.flFrom = inp.value; else S.flTo = inp.value;
  const q = inp.value.replace(/\s*\([A-Za-z]{3}\)\s*$/, '').trim();
  clearTimeout(acT);
  if (q.length < 2) return acClose(inp);
  inp.parentElement.querySelector('.acl')?.classList.add('loading');
  const seq = ++acSeq;
  acT = setTimeout(async () => { try { const list = await places(q); if (seq === acSeq && document.activeElement === inp) acRender(inp, q, list); } catch (err) { acClose(inp); } }, API ? 200 : 60);
});
document.addEventListener('focusin', e => { const inp = e.target.closest?.('[data-ac]'); if (inp) inp.select(); });
document.addEventListener('focusout', e => { const inp = e.target.closest?.('[data-ac]'); if (inp) setTimeout(() => acClose(inp), 150); });
document.addEventListener('mousedown', e => {
  const o = e.target.closest('.aco'); if (!o) return;
  e.preventDefault(); const l = o.closest('.acl'), inp = l.parentElement.querySelector('[data-ac]'); acPick(inp, l._list[+o.dataset.i]);
});
document.addEventListener('keydown', e => {
  const inp = e.target.closest?.('[data-ac]'); if (!inp) return;
  const l = inp.parentElement.querySelector('.acl');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); acMove(inp, e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Enter') {
    e.preventDefault();
    if (l && l._list?.length) { const s = l.querySelector('[aria-selected="true"]'); acPick(inp, l._list[s ? +s.dataset.i : 0]); }
    else if (inp.id.startsWith('f-')) API ? loadLive() : fillOffers();
  } else if (e.key === 'Escape') acClose(inp);
});

/* Currency picker */
function paintCur() { $('#curSym').textContent = curSym(cur); $('#curCode').textContent = cur; }
function closeCur() { $('.curmenu')?.remove(); $('#curBtn').setAttribute('aria-expanded', 'false'); }
function openCur() {
  const m = document.createElement('div'); m.className = 'curmenu'; m.setAttribute('role', 'listbox'); m.setAttribute('aria-label', 'Choose currency');
  m.innerHTML = '<div class="ch">Prices and suggestions update to match</div>' + Object.entries(CUR).map(([c, v], i) =>
    `<button role="option" aria-selected="${c === cur}" data-cur="${c}" style="animation-delay:${i * 30}ms"><span class="s ${curSym(c).length > 1 ? 'sm' : ''}">${curSym(c)}</span><span><b>${c}</b><small>${v.name}</small></span><span class="tick">${icon.check}</span></button>`).join('');
  $('.curwrap').appendChild(m); $('#curBtn').setAttribute('aria-expanded', 'true');
  $('[aria-selected="true"]', m).focus();
}
function toast(msg) { $('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400 }).onfinish = () => d.remove(), 2800); }
function setCur(c) {
  if (c === cur) return closeCur();
  cur = c; setNF(); paintCur(); closeCur(); S.flFrom = CUR[c].air; LIVE.status = 'idle';
  try { localStorage.setItem('linger-cur', c); } catch (e) {}
  route(true);
  const home = !location.hash || location.hash === '#home';
  toast(home ? `Prices in ${c} · showing escapes popular with travellers from ${CUR[c].from}` : `Prices now shown in ${c}`);
}
document.addEventListener('click', e => {
  if (e.target.closest('#curBtn')) { $('.curmenu') ? closeCur() : openCur(); return; }
  const o = e.target.closest('[data-cur]'); if (o) { setCur(o.dataset.cur); return; }
  if ($('.curmenu') && !e.target.closest('.curmenu')) closeCur();
});
document.addEventListener('keydown', e => {
  const m = $('.curmenu'); if (!m) return;
  if (e.key === 'Escape') { closeCur(); $('#curBtn').focus(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const b = $$('[data-cur]', m), i = b.indexOf(document.activeElement); b[(i + (e.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus(); }
});
paintCur();
S.flFrom = CUR[cur].air;
route();
</script>
